[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-generator"
version = "1.0.0"
description = "Local, watermark-agnostic cryptographic key lifecycle CLI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["cryptography>=44"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
watermark-generator = "watermark_generator.cli:main"
run = "watermark_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
